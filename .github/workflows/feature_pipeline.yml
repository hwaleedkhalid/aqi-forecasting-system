name: Scheduled Feature Ingestion Pipeline

"on":
  schedule:
    - cron: "17 * * * *"  # Backup GitHub cron trigger
  repository_dispatch:
    types: [hourly_ingest]  # Primary independent scheduler trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (skip external API requests)"
        required: false
        type: boolean
        default: false

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    name: Hourly Telemetry Ingestion & Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-feature-pipeline.txt

      - name: Validate Secrets on Live Runs
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "::error::OPENWEATHER_API_KEY secret is required for live scheduled feature pipeline."
            exit 1
          fi
          if [ -z "$HOPSWORKS_API_KEY" ]; then
            echo "::error::HOPSWORKS_API_KEY secret is required for live scheduled feature pipeline."
            exit 1
          fi
          if [ -z "$HOPSWORKS_PROJECT" ]; then
            echo "::error::HOPSWORKS_PROJECT secret is required for live scheduled feature pipeline."
            exit 1
          fi

      - name: Run Ingestion, Canonical Feature Construction & Hopsworks Publication
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: "eu-west.cloud.hopsworks.ai"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.feature_pipeline.run_hourly_ingestion --dry-run
          else
            python -m src.feature_pipeline.run_hourly_ingestion --live
          fi

      - name: Upload Ingestion Snapshot Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-telemetry-snapshot
          path: data/snapshots/
          retention-days: 7
