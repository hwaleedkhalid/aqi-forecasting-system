name: Daily Candidate Model Training & Evaluation Pipeline

"on":
  schedule:
    - cron: "45 2 * * *"  # Daily at 02:45 UTC (28m buffer after hourly ingestion at minute 17)
  workflow_dispatch:
    inputs:
      candidate_family:
        description: "Candidate model family to train"
        required: false
        type: choice
        options:
          - "ridge"
          - "hybrid"
          - "lightgbm"
          - "random_forest"
        default: "ridge"
      dry_run:
        description: "Run data verification without model fitting"
        required: false
        type: boolean
        default: false

concurrency:
  group: model-training-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train_and_evaluate:
    name: Daily Candidate Training & Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Feature Store Secrets
        run: |
          if [ -z "${{ secrets.HOPSWORKS_API_KEY }}" ]; then
            echo "::error::HOPSWORKS_API_KEY secret is required for Feature-Store-driven candidate training."
            exit 1
          fi

      - name: Seed Production Model From Runtime Assets
        run: |
          mkdir -p data/models
          cp -n data/runtime/production/production_hybrid_model.joblib data/models/production_hybrid_model.joblib || true

      - name: Hash Authoritative Production Assets Before Execution
        run: |
          sha256sum data/models/production_hybrid_model.joblib > /tmp/prod_model_hash_before.txt
          sha256sum \
            data/runtime/production/production_hybrid_model.joblib \
            data/runtime/production/feature_scaler_v2_weather.joblib \
            data/runtime/production/feature_schema_v2_weather.json \
            data/runtime/production/empirical_error_intervals.json \
            > /tmp/prod_authoritative_hashes_before.txt
          cat /tmp/prod_authoritative_hashes_before.txt

      - name: Run Daily Candidate Training Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT || 'aqi_predictor_by_Waleed' }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST || 'eu-west.cloud.hopsworks.ai' }}
        run: |
          FAMILY="${{ github.event.inputs.candidate_family || 'ridge' }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          CMD="python -m src.training_pipeline.run_daily_candidate --candidate-family $FAMILY --output-dir data/models/candidates"
          if [ "$DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "Executing: $CMD"
          $CMD

      - name: Assert Production Champion Immutability
        run: |
          sha256sum data/models/production_hybrid_model.joblib > /tmp/prod_model_hash_after.txt
          diff /tmp/prod_model_hash_before.txt /tmp/prod_model_hash_after.txt || {
            echo "::error::CRITICAL INVARIANT VIOLATION: Seeded production model artifact was modified!"
            exit 1
          }
          sha256sum \
            data/runtime/production/production_hybrid_model.joblib \
            data/runtime/production/feature_scaler_v2_weather.joblib \
            data/runtime/production/feature_schema_v2_weather.json \
            data/runtime/production/empirical_error_intervals.json \
            > /tmp/prod_authoritative_hashes_after.txt
          diff /tmp/prod_authoritative_hashes_before.txt /tmp/prod_authoritative_hashes_after.txt || {
            echo "::error::CRITICAL INVARIANT VIOLATION: Authoritative production runtime assets modified!"
            exit 1
          }
          echo "Production champion immutability verified: 100% byte-for-byte identical across all 4 authoritative assets."

      - name: Upload Candidate Artifacts and Evaluation Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-model-evaluation-reports
          path: data/models/candidates/
          retention-days: 14
